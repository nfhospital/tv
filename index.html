<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hospital Digital TV</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #041010; color: #ffffff;
      font-family: 'Poppins', sans-serif;
    }

    .player-layer {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: #000; pointer-events: none;
    }
    #main-layer { z-index: 10; }
    #ad-layer { z-index: 30; display: none; }
    .player-layer iframe { width: 100%; height: 100%; border: none; }

    /* Top Right Live / Ad Badge */
    #status-badge {
      position: fixed; top: 22px; right: 26px; z-index: 40;
      padding: 6px 18px; border-radius: 30px; font-size: 0.9rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; display: none;
      backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .badge-live { background: rgba(220, 38, 38, 0.92); color: #fff; animation: pulse 1.5s infinite; }
    .badge-ad { background: rgba(7, 140, 128, 0.95); color: #fff; }

    /* Unmute Pill (Appears only if browser blocks autoplay sound) */
    #unmute-pill {
      position: fixed; bottom: 28px; right: 28px; z-index: 50;
      display: none; background: rgba(7, 140, 128, 0.95); color: #fff;
      border: 2px solid #5eead4; border-radius: 40px; padding: 12px 24px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 25px rgba(0,0,0,0.5); animation: pulse 1.8s infinite;
    }

    /* Sun TV Style Broadcast Bumper Animation */
    #bumper-overlay {
      position: fixed; inset: 0; z-index: 70; display: none;
      align-items: center; justify-content: center; overflow: hidden;
      background: linear-gradient(135deg, #031f1d 0%, #078c80 50%, #042f2e 100%);
    }
    .bumper-sweep {
      position: absolute; width: 160%; height: 160%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(45, 212, 191, 0.28) 20%, transparent 40%, rgba(251, 191, 36, 0.22) 65%, transparent 85%);
      animation: spinSweep 3s linear infinite;
    }
    .bumper-ring {
      position: absolute; width: 420px; height: 420px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 80px rgba(45, 212, 191, 0.5), inset 0 0 60px rgba(255, 255, 255, 0.15);
      animation: ringExpand 2.2s ease-out forwards;
    }
    .bumper-content {
      position: relative; z-index: 2; text-align: center;
      animation: zoomFade 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .bumper-kicker {
      display: inline-block; background: #fbbf24; color: #041010;
      padding: 6px 22px; border-radius: 30px; font-size: 1rem; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px;
    }
    .bumper-main-text {
      font-size: 4.2rem; font-weight: 900; letter-spacing: 4px;
      text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.45);
      background: linear-gradient(to right, #ffffff, #ccfbf1, #fde68a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .bumper-bar {
      width: 240px; height: 6px; margin: 22px auto 0; border-radius: 6px;
      background: linear-gradient(90deg, transparent, #fbbf24, #ffffff, #2dd4bf, transparent);
      animation: barGlow 1.5s ease-in-out infinite;
    }

    @keyframes spinSweep { to { transform: rotate(360deg); } }
    @keyframes ringExpand { 0% { transform: scale(0.4); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.65); opacity: 0; } }
    @keyframes zoomFade { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes barGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* Dashboard */
    #dashboard {
      display: none; padding: 40px 20px; height: 100vh; overflow-y: auto; text-align: center;
      background: radial-gradient(circle at top, #0a2e2b 0%, #041010 100%);
    }
    .dash-title { font-size: 2.3rem; font-weight: 800; color: #2dd4bf; margin-bottom: 8px; }
    .dash-sub { color: #94a3b8; margin-bottom: 35px; }
    .tv-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1100px; margin: 0 auto; }
    .tv-card {
      background: rgba(15, 35, 34, 0.9); border: 2px solid #078c80; border-radius: 16px;
      padding: 25px; width: 270px; text-decoration: none; color: #fff;
      transition: 0.25s; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .tv-card:hover, .tv-card:focus { transform: translateY(-5px); border-color: #2dd4bf; background: #0d3b37; }
    .tv-card h2 { color: #2dd4bf; font-size: 1.5rem; margin-bottom: 6px; }
    .tv-card p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 10px; }
    .tv-meta { font-size: 0.8rem; color: #fbbf24; font-weight: 600; }

    #msg-box {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #041010; padding: 30px;
    }
  </style>
</head>
<body>

  <!-- Dashboard -->
  <div id="dashboard">
    <h1 class="dash-title">📺 Hospital Digital TV Control</h1>
    <p class="dash-sub">Select a TV to launch Live News / Programs + Hospital Ads</p>
    <div id="tv-grid" class="tv-grid"><p>Loading TVs...</p></div>
  </div>

  <!-- Main Player Layer (Live News / Playlist / Movie) -->
  <div id="main-layer" class="player-layer"><div id="main-player"></div></div>

  <!-- Hospital Ad Overlay Layer -->
  <div id="ad-layer" class="player-layer"><div id="ad-player"></div></div>

  <!-- Badge & Unmute Button -->
  <div id="status-badge"></div>
  <button id="unmute-pill">🔇 Press OK for Sound</button>

  <!-- Bumper Animation -->
  <div id="bumper-overlay">
    <div class="bumper-sweep"></div>
    <div class="bumper-ring"></div>
    <div class="bumper-content">
      <div class="bumper-kicker" id="bumper-kicker">HEALTH UPDATE</div>
      <div class="bumper-main-text" id="bumper-text">SHORT BREAK</div>
      <div class="bumper-bar"></div>
    </div>
  </div>

  <!-- Error Message -->
  <div id="msg-box"><h2 id="msg-text" style="color:#f87171; font-size:2rem;"></h2></div>

  <script>
    // =========================================================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
    // =========================================================================
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbzTnBGA8jwqy4uoBSqlrL4_fK41Wotd4F_s7BDR99lKiui6bD8_JM-LCaVYf_PkwQTCkw/exec";
    // =========================================================================

    const TV_ID = (new URLSearchParams(window.location.search).get("tv") || "").trim();
    const STORAGE_KEY = "HOSP_TV_RESUME_" + TV_ID;

    let appData = null;
    let mainPlayer = null;
    let adPlayer = null;
    let ytReady = false;
    let mainReady = false;
    let adReady = false;
    let started = false;
    let isAdPlaying = false;
    let currentMediaSource = "";
    let currentInterval = 0;
    let resumeTime = 0;
    let pendingResumeTime = 0;
    let adTimer = null;
    let adSafetyTimeout = null;
    let saveTimer = null;
    let adQueue = [];
    let knownAds = [];
    let audioCtx = null;

    if (!TV_ID) {
      loadDashboard();
    } else {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      fetchConfig(true);
      setInterval(() => fetchConfig(false), 120000); // Sync sheet every 2 mins
    }

    function loadDashboard() {
      document.getElementById("dashboard").style.display = "block";
      fetch(SCRIPT_API_URL)
        .then(r => r.json())
        .then(res => {
          const grid = document.getElementById("tv-grid");
          if (!res.tvs || res.tvs.length === 0) {
            grid.innerHTML = "<p>No TVs found in Master_TV_List.</p>";
            return;
          }
          grid.innerHTML = res.tvs.map(tv => `
            <a class="tv-card" href="?tv=${encodeURIComponent(tv.id)}">
              <h2>${tv.id}</h2>
              <p>${tv.location}</p>
              <div class="tv-meta">Ad Interval: Every ${tv.adInterval} mins</div>
            </a>
          `).join("");
        })
        .catch(() => {
          document.getElementById("tv-grid").innerHTML = "<p style='color:#f87171'>Failed to connect to Sheet API.</p>";
        });
    }

    function onYouTubeIframeAPIReady() {
      ytReady = true;
      initPlayers();
    }

    function fetchConfig(isInitial) {
      fetch(`${SCRIPT_API_URL}?tv=${encodeURIComponent(TV_ID)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status !== "ok") {
            showMessage(res.message || "Configuration error");
            return;
          }
          appData = res;
          syncNewAds();

          if (appData.tv.status === "OFF") {
            showMessage("TV is turned OFF in Master_TV_List.");
            if (mainPlayer && mainPlayer.pauseVideo) mainPlayer.pauseVideo();
            return;
          }
          if (!appData.mediaSource) {
            showMessage("No active Live / Playlist / Video found in Master_TV_List.");
            return;
          }
          hideMessage();

          if (isInitial) {
            initPlayers();
          } else if (started) {
            // Switch media ONLY if source changed in sheet (or Live stream restarted)
            if (appData.mediaSource !== currentMediaSource) {
              currentMediaSource = appData.mediaSource;
              if (!isAdPlaying && mainReady) {
                loadMainMedia(false);
              }
            }
            // Update ad timer ONLY if Ad Interval changed in sheet
            if (appData.tv.adInterval !== currentInterval) {
              currentInterval = appData.tv.adInterval;
              if (!isAdPlaying) scheduleNextAd();
            }
          }
        })
        .catch(err => console.error("Sync error:", err));
    }

    function initPlayers() {
      if (!ytReady || !appData || mainPlayer) return;

      mainPlayer = new YT.Player("main-player", {
        playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1 },
        events: {
          onReady: () => { mainReady = true; tryStartTV(); },
          onStateChange: onMainStateChange,
          onError: () => {
            if (currentMediaSource.startsWith("LIVE:")) {
              setTimeout(() => fetchConfig(false), 10000);
            } else if (currentMediaSource.startsWith("PLAYLIST:") && mainPlayer.nextVideo) {
              setTimeout(() => mainPlayer.nextVideo(), 1000);
            }
          }
        }
      });

      adPlayer = new YT.Player("ad-player", {
        playerVars: { autoplay: 0, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1 },
        events: {
          onReady: () => { adReady = true; },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED && isAdPlaying) {
              finishAdAndResume();
            }
          },
          onError: () => {
            if (isAdPlaying) finishAdAndResume();
          }
        }
      });
    }

    function tryStartTV() {
      if (started || !mainReady || !appData || !appData.mediaSource) return;
      started = true;
      currentMediaSource = appData.mediaSource;
      currentInterval = appData.tv.adInterval;

      mainPlayer.unMute();
      mainPlayer.setVolume(100);
      loadMainMedia(true);
      scheduleNextAd();
      startResumeSaver();

      // Check if browser muted autoplay
      setTimeout(() => {
        if (!mainPlayer || typeof mainPlayer.getPlayerState !== "function") return;
        const st = mainPlayer.getPlayerState();
        if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
          mainPlayer.mute();
          mainPlayer.playVideo();
          document.getElementById("unmute-pill").style.display = "block";
        } else if (mainPlayer.isMuted && mainPlayer.isMuted()) {
          document.getElementById("unmute-pill").style.display = "block";
        }
      }, 2500);
    }

    function loadMainMedia(tryResume) {
      pendingResumeTime = 0;

      if (currentMediaSource.startsWith("LIVE:")) {
        const vid = currentMediaSource.replace("LIVE:", "");
        showBadge("● LIVE NEWS", "badge-live");
        mainPlayer.loadVideoById(vid);

      } else if (currentMediaSource.startsWith("PLAYLIST:")) {
        const listId = currentMediaSource.replace("PLAYLIST:", "");
        hideBadge();
        mainPlayer.loadPlaylist({ list: listId, listType: "playlist" });
        setTimeout(() => {
          if (mainPlayer && mainPlayer.setShuffle) mainPlayer.setShuffle(true);
          if (mainPlayer && mainPlayer.setLoop) mainPlayer.setLoop(true);
        }, 1500);

      } else if (currentMediaSource.startsWith("VIDEO:")) {
        const vid = currentMediaSource.replace("VIDEO:", "");
        hideBadge();
        let startSec = 0;
        if (tryResume) {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            if (saved.vid === vid && saved.time > 5) {
              startSec = Math.floor(saved.time);
              pendingResumeTime = startSec;
            }
          } catch (e) {}
        }
        mainPlayer.loadVideoById({ videoId: vid, startSeconds: startSec });
      }
    }

    function onMainStateChange(e) {
      // Ensure exact second resume on single movie after power cut
      if (e.data === YT.PlayerState.PLAYING && pendingResumeTime > 5 && !isAdPlaying) {
        const cur = mainPlayer.getCurrentTime ? mainPlayer.getCurrentTime() : 0;
        if (Math.abs(cur - pendingResumeTime) > 10) {
          mainPlayer.seekTo(pendingResumeTime, true);
        }
        pendingResumeTime = 0;
      }
      // Loop single movie when finished
      if (e.data === YT.PlayerState.ENDED && !isAdPlaying && currentMediaSource.startsWith("VIDEO:")) {
        localStorage.removeItem(STORAGE_KEY);
        mainPlayer.seekTo(0, true);
        mainPlayer.playVideo();
      }
    }

    function startResumeSaver() {
      clearInterval(saveTimer);
      saveTimer = setInterval(() => {
        if (!isAdPlaying && pendingResumeTime === 0 && currentMediaSource.startsWith("VIDEO:") && mainPlayer && mainPlayer.getCurrentTime) {
          const st = mainPlayer.getPlayerState ? mainPlayer.getPlayerState() : -1;
          if (st === YT.PlayerState.PLAYING) {
            const t = mainPlayer.getCurrentTime();
            if (t > 5) {
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                  vid: currentMediaSource.replace("VIDEO:", ""),
                  time: t
                }));
              } catch (e) {}
            }
          }
        }
      }, 5000);
    }

    // Unlock Sound on OK/Click
    function unlockAudio() {
      document.getElementById("unmute-pill").style.display = "none";
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();
      } catch (e) {}
      if (!isAdPlaying && mainPlayer && mainPlayer.unMute) {
        mainPlayer.unMute();
        mainPlayer.setVolume(100);
      }
      if (isAdPlaying && adPlayer && adPlayer.unMute) {
        adPlayer.unMute();
        adPlayer.setVolume(100);
      }
    }
    document.getElementById("unmute-pill").addEventListener("click", unlockAudio);
    document.addEventListener("click", unlockAudio);
    document.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") unlockAudio(); });

    // --- HOSPITAL AD ENGINE ---
    function syncNewAds() {
      const activeIds = (appData.ads || []).map(a => a.id);
      const newOnes = activeIds.filter(id => !knownAds.includes(id));
      adQueue = adQueue.filter(id => activeIds.includes(id));
      if (newOnes.length > 0) {
        shuffleArray(newOnes).forEach(id => {
          if (!adQueue.includes(id)) adQueue.unshift(id); // New / Today's special ad plays FIRST
        });
      }
      knownAds = [...activeIds];
    }

    function getNextAdId() {
      const activeIds = (appData.ads || []).map(a => a.id);
      if (activeIds.length === 0) return null;
      adQueue = adQueue.filter(id => activeIds.includes(id));
      if (adQueue.length === 0) adQueue = shuffleArray([...activeIds]);
      return adQueue.shift();
    }

    function scheduleNextAd() {
      clearTimeout(adTimer);
      const mins = Number(currentInterval) || 0;
      if (mins <= 0) return;
      adTimer = setTimeout(triggerHospitalAd, mins * 60 * 1000);
    }

    function triggerHospitalAd() {
      if (isAdPlaying) return;
      const adId = getNextAdId();
      if (!adId || !adReady) {
        scheduleNextAd();
        return;
      }

      isAdPlaying = true;
      const isLive = currentMediaSource.startsWith("LIVE:");
      const wasMuted = mainPlayer && mainPlayer.isMuted ? mainPlayer.isMuted() : false;

      if (isLive) {
        if (mainPlayer && mainPlayer.mute) mainPlayer.mute();
      } else if (mainPlayer && mainPlayer.getCurrentTime) {
        resumeTime = mainPlayer.getCurrentTime() || 0;
        if (mainPlayer.pauseVideo) mainPlayer.pauseVideo();
      }

      playBumper("HEALTH UPDATE", "SHORT BREAK", () => {
        document.getElementById("ad-layer").style.display = "block";
        showBadge("HOSPITAL INFO", "badge-ad");

        if (!wasMuted) {
          adPlayer.unMute();
          adPlayer.setVolume(100);
        } else {
          adPlayer.mute();
        }
        adPlayer.loadVideoById(adId);

        // Safety fallback: Auto-resume after 95 seconds if ad gets stuck
        clearTimeout(adSafetyTimeout);
        adSafetyTimeout = setTimeout(() => {
          if (isAdPlaying) finishAdAndResume();
        }, 95000);
      });
    }

    function finishAdAndResume() {
      if (!isAdPlaying) return;
      clearTimeout(adSafetyTimeout);
      hideBadge();

      if (adPlayer && adPlayer.stopVideo) {
        try { adPlayer.stopVideo(); } catch (e) {}
      }

      const isLive = currentMediaSource.startsWith("LIVE:");
      playBumper("WELCOME BACK", isLive ? "LIVE NEWS" : "NOW PLAYING", () => {
        document.getElementById("ad-layer").style.display = "none";
        isAdPlaying = false;

        if (mainPlayer) {
          const allowSound = document.getElementById("unmute-pill").style.display === "none";
          if (isLive) {
            showBadge("● LIVE NEWS", "badge-live");
            if (allowSound) { mainPlayer.unMute(); mainPlayer.setVolume(100); }
            mainPlayer.playVideo();
          } else {
            if (allowSound) { mainPlayer.unMute(); mainPlayer.setVolume(100); }
            mainPlayer.seekTo(resumeTime, true);
            mainPlayer.playVideo();
          }
        }
        scheduleNextAd();
      });
    }

    // --- BUMPER ANIMATION ---
    function playBumper(kicker, title, callback) {
      const overlay = document.getElementById("bumper-overlay");
      document.getElementById("bumper-kicker").textContent = kicker;
      document.getElementById("bumper-text").textContent = title;

      overlay.style.display = "none";
      void overlay.offsetWidth;
      overlay.style.display = "flex";

      playChime();
      setTimeout(() => {
        overlay.style.display = "none";
        if (callback) callback();
      }, 2400);
    }

    function playChime() {
      if (!audioCtx || audioCtx.state !== "running") return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + i * 0.11);
        gain.gain.setValueAtTime(0.001, now + i * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.11 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.11);
        osc.stop(now + i * 0.11 + 0.6);
      });
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function showBadge(txt, cls) {
      const b = document.getElementById("status-badge");
      b.textContent = txt; b.className = cls; b.style.display = "block";
    }
    function hideBadge() { document.getElementById("status-badge").style.display = "none"; }
    function showMessage(txt) { document.getElementById("msg-text").textContent = txt; document.getElementById("msg-box").style.display = "flex"; }
    function hideMessage() { document.getElementById("msg-box").style.display = "none"; }
  </script>
</body>
</html>
